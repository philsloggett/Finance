<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — review</title>
<style>
  :root {
    --cover: #1d2b22;        /* bottle-green book cover */
    --cover-deep: #16211a;
    --paper: #edefdf;        /* pale-green ledger paper */
    --paper-line: #c9d1b4;   /* ruling */
    --ink: #26301f;
    --ink-faint: #6b7360;
    --debit: #a03325;        /* red ink */
    --credit: #2e6b44;       /* green ink */
    --margin-rule: #c0442f;  /* the ledger margin line */
    --gilt: #c9a648;         /* page-edge gilt, used sparingly */
    --mono: "Cascadia Mono", ui-monospace, Consolas, monospace;
    --sans: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(160deg, var(--cover), var(--cover-deep));
    color: var(--paper);
    font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center;
    padding: 1.2rem 1rem 0.8rem;
    gap: 0.9rem;
  }

  /* ---- progress: the running totals a bookkeeper keeps in the corner ---- */
  header {
    width: min(46rem, 100%);
    display: flex; align-items: baseline; gap: 1.6rem; flex-wrap: wrap;
  }
  header h1 {
    font-size: 0.82rem; font-weight: 600; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--gilt);
  }
  .acct { flex: 1 1 10rem; min-width: 10rem; }
  .acct .lbl {
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 0.72rem; color: #b9c2ae;
  }
  .bar {
    height: 4px; margin-top: 4px;
    background: #37453a; border-radius: 2px; overflow: hidden;
  }
  .bar i { display: block; height: 100%; background: var(--gilt); transition: width 0.4s; }
  .counter { font-family: var(--mono); font-size: 0.72rem; color: #b9c2ae; }

  /* ---- the ledger page ---- */
  main { width: min(46rem, 100%); }
  .page {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    border-left: 3px solid var(--margin-rule);
    box-shadow: 0 12px 30px #0007;
    padding: 1.5rem 1.7rem 1.3rem;
    min-height: 21rem;
  }
  .entry-meta {
    display: flex; gap: 1.1rem; flex-wrap: wrap;
    font-family: var(--mono); font-size: 0.74rem; color: var(--ink-faint);
    margin-bottom: 0.4rem;
  }
  .amount { font-family: var(--mono); font-weight: 600; }
  .amount.debit { color: var(--debit); }
  .amount.credit { color: var(--credit); }
  .norm {
    font-family: var(--mono); font-size: 1.32rem; font-weight: 700;
    line-height: 1.4; letter-spacing: 0.02em; overflow-wrap: anywhere;
    margin: 0.5rem 0 0.7rem;
  }
  .samples {
    padding: 0.5rem 0.7rem; background: #e2e6d2; border-radius: 3px;
  }
  .samples div {
    font-family: var(--mono); font-size: 0.78rem; color: var(--ink-faint);
    line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .suggest-line {
    margin-top: 0.9rem; line-height: 1.6;
    font-size: 0.9rem; display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap;
  }
  .suggest-line .cat { font-weight: 700; }
  .suggest-line .conf { font-family: var(--mono); font-size: 0.75rem; color: var(--ink-faint); }
  .badge {
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 0 0.4rem; border: 1px solid currentColor; border-radius: 2px;
  }
  .badge.llm { color: #5b5a8f; }
  .badge.conflict { color: var(--debit); }
  .conflict-cats { font-size: 0.85rem; }

  .done-msg { line-height: 1.7; font-size: 1rem; padding-top: 1rem; }

  /* ---- list panels (context / decisions / unusual) ---- */
  .panel-list {
    max-height: 60vh; overflow-y: auto; margin-top: 0.6rem;
    font-family: var(--mono); font-size: 0.76rem;
  }
  .panel-list .row {
    display: flex; gap: 0.7rem; align-items: baseline; padding: 0.22rem 0.35rem;
    border-radius: 3px; line-height: 1.5;
  }
  .panel-list .row:nth-child(odd) { background: #e6e9d8; }
  .panel-list .row.focal { outline: 2px solid var(--gilt); }
  .panel-list .date { color: var(--ink-faint); white-space: nowrap; }
  .panel-list .acct { color: var(--ink-faint); width: 4.2rem; }
  .panel-list .amt { min-width: 7rem; text-align: right; font-weight: 600; }
  .panel-list .desc { flex: 1; overflow-wrap: anywhere; }
  .panel-list .cat { color: var(--ink-faint); font-family: var(--sans); font-size: 0.74rem; white-space: nowrap; }
  .panel-list .why { color: var(--debit); font-family: var(--sans); font-size: 0.74rem; }
  .panel-list button {
    all: unset; cursor: pointer; font-family: var(--sans); font-size: 0.7rem;
    padding: 0 0.35rem; border: 1px solid var(--paper-line); border-radius: 3px;
    color: var(--ink-faint); white-space: nowrap;
  }
  .panel-list button:hover, .panel-list button:focus-visible { background: #d9decc; outline: none; }
  .panel-list .row.inactive { opacity: 0.45; }
  .panel-head { display: flex; gap: 0.7rem; align-items: center; margin-top: 0.2rem; }
  .panel-head select, .panel-head input {
    font-family: var(--mono); font-size: 0.78rem; color: var(--ink);
    background: #fff; border: 1px solid var(--paper-line); border-radius: 3px;
    padding: 0.28rem 0.4rem;
  }
  .panel-head input { flex: 1; }

  /* ---- actions ---- */
  footer {
    width: min(46rem, 100%);
    display: flex; gap: 0.9rem; flex-wrap: wrap; align-items: center;
    color: #b9c2ae; font-size: 0.8rem;
  }
  kbd {
    font-family: var(--mono); font-size: 0.74rem; color: var(--paper);
    background: #ffffff14; border: 1px solid #ffffff2e; border-bottom-width: 2px;
    border-radius: 3px; padding: 0.05rem 0.38rem; margin-right: 0.3rem;
  }
  footer button {
    all: unset; cursor: pointer; display: inline-flex; align-items: center;
    padding: 0.2rem 0.3rem; border-radius: 3px;
  }
  footer button:hover { background: #ffffff10; }
  footer button:focus-visible { outline: 2px solid var(--gilt); }
  .status { margin-left: auto; font-family: var(--mono); font-size: 0.74rem; min-height: 1em; }
  .status.err { color: #e08a7a; }

  /* ---- category picker ---- */
  dialog {
    border: none; border-radius: 4px; padding: 1.1rem 1.3rem;
    background: var(--paper); color: var(--ink);
    box-shadow: 0 18px 50px #000a; width: min(38rem, 92vw);
  }
  #ctx, #dec, #unu { width: min(52rem, 95vw); }
  #viz { width: min(64rem, 96vw); max-height: 94vh; overflow-y: auto; }

  /* ---- charts ---- */
  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e;
    --muted: #898781; --grid: #e1e0d9; --baseline: #c3c2b7;
    margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.8rem;
  }
  .viz-controls { display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--paper-line); border-radius: 4px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 0.26rem 0.75rem; font-size: 0.78rem; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .seg button:focus-visible { outline: 2px solid var(--gilt); outline-offset: -2px; }
  .viz-note { font-size: 0.72rem; color: var(--ink-faint); }
  .viz-grid { display: grid; grid-template-columns: 16rem 1fr; gap: 1rem; align-items: stretch; }
  @media (max-width: 46rem) { .viz-grid { grid-template-columns: 1fr; } }
  .viz-card {
    background: var(--surface-1); border: 1px solid rgba(11,11,11,0.10);
    border-radius: 6px; padding: 0.9rem; position: relative;
  }
  .viz-card h3 {
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 0.6rem;
  }
  .bar-rows { display: flex; flex-direction: column; gap: 3px; max-height: 15.5rem; overflow-y: auto; }
  .bar-row { display: grid; grid-template-columns: 11.5rem 1fr 8.5rem; gap: 0.6rem; align-items: center; }
  .bar-row .nm { font-size: 0.74rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row .track { height: 12px; }
  .bar-row .track i { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar-row .val {
    font-family: var(--mono); font-size: 0.7rem; color: var(--text-secondary);
    text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .chips { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .chip {
    all: unset; cursor: pointer; display: inline-flex; gap: 0.35rem; align-items: center;
    font-size: 0.72rem; color: var(--text-secondary);
    border: 1px solid var(--grid); border-radius: 999px; padding: 0.12rem 0.55rem;
  }
  .chip i { width: 9px; height: 9px; border-radius: 50%; }
  .chip.off { opacity: 0.35; }
  .chip:focus-visible { outline: 2px solid var(--gilt); }
  .viz-tip {
    position: absolute; pointer-events: none; display: none; z-index: 2;
    background: #fff; border: 1px solid rgba(11,11,11,0.10); border-radius: 4px;
    box-shadow: 0 4px 14px #0003; padding: 0.4rem 0.55rem; font-size: 0.72rem;
    color: var(--text-primary); min-width: 10rem;
  }
  .viz-tip .tr { display: flex; gap: 0.5rem; align-items: center; justify-content: space-between; }
  .viz-tip .tr i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .viz-tip .tr span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  dialog::backdrop { background: #16211ac9; }
  dialog h2 {
    font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 0.7rem;
  }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 2px; }
  .cats button {
    all: unset; cursor: pointer; display: flex; gap: 0.55rem; align-items: baseline;
    padding: 0.24rem 0.45rem; border-radius: 3px; font-size: 0.86rem;
  }
  .cats button:hover, .cats button:focus-visible { background: #d9decc; outline: none; }
  .cats button.hot { background: #f3e9c8; }
  .cats kbd { color: var(--ink); background: #d9decc; border-color: #b4bb9d; }
  .pattern-row {
    display: flex; gap: 0.6rem; margin-top: 0.9rem; align-items: center;
    font-family: var(--mono); font-size: 0.8rem;
  }
  .pattern-row select, .pattern-row input {
    font-family: var(--mono); font-size: 0.8rem; color: var(--ink);
    background: #fff; border: 1px solid var(--paper-line); border-radius: 3px; padding: 0.3rem 0.4rem;
  }
  .pattern-row input { flex: 1; }
  .pattern-row label { display: flex; align-items: center; gap: 0.35rem; font-family: var(--sans); font-size: 0.78rem; }

</style>
</head>
<body>
  <header>
    <h1>Ledger</h1>
    <div class="acct" id="acct-savings"></div>
    <div class="acct" id="acct-credit"></div>
    <div class="counter" id="counter"></div>
  </header>

  <main><div class="page" id="page"></div></main>

  <footer id="legend">
    <button data-act="accept"><kbd>a</kbd>accept → rule</button>
    <button data-act="edit"><kbd>e</kbd>edit</button>
    <button data-act="skip"><kbd>s</kbd>skip</button>
    <button data-act="transfer"><kbd>t</kbd>internal</button>
    <button data-act="oneoff"><kbd>x</kbd>one-off</button>
    <button data-act="rejectsug"><kbd>r</kbd>reject sugg.</button>
    <button data-act="undoskip"><kbd>u</kbd>unskip</button>
    <button data-act="context"><kbd>c</kbd>context</button>
    <button data-act="decisions"><kbd>d</kbd>decisions</button>
    <button data-act="unusual"><kbd>f</kbd>flagged</button>
    <button data-act="charts"><kbd>v</kbd>charts</button>
    <span class="status" id="status"></span>
  </footer>

  <dialog id="ctx">
    <h2>In context — surrounding transactions</h2>
    <div class="panel-head">
      <select id="occ"></select>
      <span style="font-size:0.74rem;color:var(--ink-faint)">±7 days, all accounts · click override to fix one txn</span>
    </div>
    <div class="panel-list" id="ctx-list"></div>
  </dialog>

  <dialog id="dec">
    <h2>Decisions — your rules, newest first</h2>
    <div class="panel-head"><input id="dec-filter" placeholder="filter by merchant or category…" spellcheck="false"></div>
    <div class="panel-list" id="dec-list"></div>
  </dialog>

  <dialog id="unu">
    <h2>Flagged</h2>
    <div id="followups-wrap" style="display:none">
      <h2 style="margin-top:0.6rem">Your follow-ups</h2>
      <div class="panel-list" id="follow-list"></div>
    </div>
    <h2 style="margin-top:0.6rem">Unusual payments (automatic)</h2>
    <div class="panel-list" id="unu-list"></div>
  </dialog>

  <dialog id="viz">
    <h2>Charts — where the money goes</h2>
    <div class="viz-root">
      <div class="viz-controls">
        <div class="seg" id="viz-mode">
          <button data-m="spend" class="on">Spending</button>
          <button data-m="income">Income</button>
        </div>
        <select id="viz-fy"></select>
        <span class="viz-note" id="viz-note"></span>
      </div>
      <div class="viz-grid">
        <div class="viz-card"><h3 id="donut-title"></h3><div id="donut"></div></div>
        <div class="viz-card"><h3>By category</h3><div class="bar-rows" id="viz-bars"></div></div>
      </div>
      <div class="viz-card">
        <h3 id="trend-title"></h3>
        <div class="chips" id="viz-chips"></div>
        <div id="trend"></div>
        <div class="viz-tip" id="viz-tip"></div>
      </div>
    </div>
  </dialog>

  <dialog id="picker">
    <h2 id="picker-title">Choose category</h2>
    <div class="cats" id="cats"></div>
    <div class="pattern-row" id="pattern-row">
      <select id="match">
        <option>exact</option><option>prefix</option><option>substring</option><option>regex</option>
      </select>
      <input id="pattern" spellcheck="false">
      <label><input type="checkbox" id="as-override">one-off</label>
    </div>
  </dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);
const KEYS = "1234567890abcdefghijklmnopqrstuvwxyz";
let state = null, idx = 0, skipped = [], busy = false;

const cents = c => {
  const s = (Math.abs(c) / 100).toLocaleString("en-AU", {minimumFractionDigits: 2});
  return (c < 0 ? "-$" : "$") + s;
};

function renderProgress(p) {
  if (state) { state.progress = p; renderCounter(); }
  for (const a of p.accounts) {
    const el = $("acct-" + a.id);
    if (!el) continue;
    const pct = a.vol ? Math.round(100 * a.vol_c / a.vol) : 0;
    el.title = `${a.id}: ${cents(a.vol_c)} of ${cents(a.vol)} categorised `
      + `(${a.rows_c} of ${a.rows} transactions)`;
    el.innerHTML = `<div class="lbl"><span>${a.id}</span><span>${pct}% of $ categorised</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>`;
  }
}

function current() { return state.queue[idx] ?? null; }

function renderCounter() {
  const total = state.progress?.remaining_strings ?? state.queue.length;
  const rows = state.progress?.remaining_rows ?? 0;
  const el = $("counter");
  el.textContent = total ? `${total.toLocaleString()} strings to go` : "";
  el.title = `${total.toLocaleString()} distinct merchant strings still unclassified `
    + `(${rows.toLocaleString()} transactions). The list holds the top `
    + `${state.queue.length} by $ leverage — most of the rest are one-off small amounts.`;
}

function renderItem(animate = false) {
  const page = $("page");
  if (animate && !matchMedia("(prefers-reduced-motion: reduce)").matches)
    page.animate(
      [{opacity: 0.2, transform: "translateY(0.4rem)"}, {opacity: 1, transform: "none"}],
      {duration: 140, easing: "ease-out"});
  const it = current();
  renderCounter();
  if (!it) {
    page.innerHTML = `<div class="done-msg">Queue clear — every remaining string is long-tail.
      <br>Press <b>g</b> to refetch, or run <span style="font-family:var(--mono)">ledger suggest</span> for the next batch.</div>`;
    return;
  }
  const sug = it.suggestion;
  const sign = it.total < 0 ? "debit" : "credit";
  page.innerHTML = `
    <div class="entry-meta">
      <span>${it.n} txn${it.n > 1 ? "s" : ""}</span>
      <span class="amount ${sign}">${cents(it.total)}</span>
      <span>${it.accounts}</span>
      <span>${it.first.slice(0, 7)} → ${it.last.slice(0, 7)}</span>
    </div>
    <div class="norm">${esc(it.norm)}</div>
    <div class="samples">${it.samples.map(s => `<div>${esc(s.replace(/\n/g, " "))}</div>`).join("")}</div>
    ${sug ? `<div class="suggest-line">
        <span class="badge llm">${esc(sug.model?.startsWith("claude") ? "llm" : sug.model || "llm")}</span>
        <span class="cat">${esc(sug.budget_category)}</span>
        <span class="conf">conf ${sug.confidence.toFixed(2)} · ${sug.suggested_match_type} “${esc(sug.suggested_pattern)}”</span>
      </div>` : ""}
    ${it.conflict ? `<div class="suggest-line">
        <span class="badge conflict">legacy conflict</span>
        <span class="conflict-cats">${it.conflict.map(esc).join(" vs ")}</span>
      </div>` : ""}`;
}

const esc = s => s.replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

async function fetchState() {
  state = await (await fetch("/api/state")).json();
  idx = 0; skipped = [];
  renderProgress(state.progress);
  renderItem();
}

function advance() {
  state.queue.splice(idx, 1);
  if (idx >= state.queue.length) idx = Math.max(0, state.queue.length - 1);
  renderItem(true);
}

async function post(path, body) {
  busy = true; setStatus("…");
  try {
    const res = await fetch(path, {method: "POST", body: JSON.stringify(body)});
    const data = await res.json();
    if (!res.ok) { setStatus(data.error, true); return null; }
    if (data.progress) renderProgress(data.progress);
    setStatus("");
    return data;
  } catch (e) { setStatus(String(e), true); return null; }
  finally { busy = false; }
}

function setStatus(msg, err = false) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (err ? " err" : "");
}

function ruleCovers(match, pattern, norm) {
  if (match === "exact") return norm === pattern;
  if (match === "prefix") return norm.startsWith(pattern);
  if (match === "substring") return norm.includes(pattern);
  try { return new RegExp(pattern).test(norm); } catch { return false; }
}

async function acceptWith(budget, match, pattern, asOverride = false) {
  const it = current();
  const path = asOverride ? "/api/override" : "/api/accept";
  const ok = await post(path, {norm: it.norm, budget, match, pattern});
  if (!ok) return;
  if (asOverride) { advance(); return; }
  // the new rule may have resolved other queued strings — sweep them too
  const before = state.queue.length;
  state.queue = state.queue.filter(q => !ruleCovers(match, pattern, q.norm));
  if (idx >= state.queue.length) idx = Math.max(0, state.queue.length - 1);
  const swept = before - state.queue.length - 1;
  if (swept > 0) setStatus(`rule also cleared ${swept} more queued item${swept > 1 ? "s" : ""}`);
  renderItem(true);
}

const actions = {
  accept() {
    const it = current();
    if (!it?.suggestion) { actions.edit(); return; }
    const s = it.suggestion;
    acceptWith(s.budget_category, s.suggested_match_type, s.suggested_pattern);
  },
  edit() { if (current()) openPicker(false); },
  oneoff() { if (current()) openPicker(true); },
  skip() { if (current()) { skipped.push(state.queue[idx]); advance(); } },
  undoskip() {
    if (skipped.length) { state.queue.splice(idx, 0, skipped.pop()); renderItem(); }
  },
  transfer() { if (current()) acceptWith("Internal", "exact", current().norm); },
  async rejectsug() {
    const it = current();
    if (!it?.suggestion) return;
    if (await post("/api/reject", {norm: it.norm})) { it.suggestion = null; renderItem(); }
  },
  context() { if (current()) openContext(current()); },
  decisions() { loadDecisions(); $("dec").showModal(); },
  unusual() { loadUnusual(); $("unu").showModal(); },
  charts() { openCharts(); },
};

/* ---- picker (shared by review item, rule edit, txn override) ---- */
let pickerMode = {type: "item"};
function renderCats(hot) {
  $("cats").innerHTML = state.categories.map((c, i) =>
    `<button data-cat="${esc(c)}" class="${hot.has(c) ? "hot" : ""}">
       <kbd>${KEYS[i]}</kbd>${esc(c)}</button>`).join("");
  for (const b of $("cats").querySelectorAll("button"))
    b.onclick = () => pickCategory(b.dataset.cat);
}

function openPicker(asOverride) {
  const it = current();
  pickerMode = {type: "item"};
  $("picker-title").textContent = asOverride
    ? "One-off — override these txns, no rule" : "Choose category → rule";
  $("pattern-row").style.display = "";
  $("as-override").checked = asOverride;
  $("match").value = it.suggestion?.suggested_match_type ?? "exact";
  $("pattern").value = it.suggestion?.suggested_pattern ?? it.norm;
  renderCats(new Set([...(it.conflict ?? []), it.suggestion?.budget_category].filter(Boolean)));
  $("picker").showModal();
}

function openPickerFor(mode, title, hotCat) {
  pickerMode = mode;
  $("picker-title").textContent = title;
  $("pattern-row").style.display = "none";
  renderCats(new Set([hotCat].filter(Boolean)));
  $("picker").showModal();
}

async function pickCategory(cat) {
  $("picker").close();
  const m = pickerMode;
  if (m.type === "item")
    acceptWith(cat, $("match").value, $("pattern").value, $("as-override").checked);
  else if (m.type === "rule") {
    if (await post("/api/rules/update", {id: m.id, budget: cat})) loadDecisions();
  } else if (m.type === "txn") {
    if (await post("/api/override_txn", {txn_id: m.txnId, budget: cat})) loadContext();
  }
}

/* ---- context view ---- */
let ctxState = {occ: [], focal: null};
async function openContext(item) {
  const res = await (await fetch("/api/occurrences?norm=" + encodeURIComponent(item.norm))).json();
  ctxState.occ = res.occurrences;
  const biggest = ctxState.occ.reduce((a, b) => Math.abs(b.amount) > Math.abs(a.amount) ? b : a);
  $("occ").innerHTML = ctxState.occ.map(o =>
    `<option value="${o.txn_id}" ${o.txn_id === biggest.txn_id ? "selected" : ""}>
       ${o.date} · ${cents(o.amount)} · ${o.account_id}</option>`).join("");
  $("occ").onchange = loadContext;
  $("ctx").showModal();
  loadContext();
}

async function openContextAt(date, txnId) {
  ctxState.occ = [{txn_id: txnId, date}];
  $("occ").innerHTML = `<option value="${txnId}" selected>${date}</option>`;
  $("occ").onchange = loadContext;
  $("ctx").showModal();
  loadContext();
}

async function loadContext() {
  const focalId = $("occ").value;
  const focal = ctxState.occ.find(o => o.txn_id === focalId);
  const res = await (await fetch(`/api/context?date=${focal.date}&days=7`)).json();
  $("ctx-list").innerHTML = res.context.map(t => `
    <div class="row ${t.txn_id === focalId ? "focal" : ""}">
      <span class="date">${t.date}</span><span class="acct">${t.account_id}</span>
      <span class="amt amount ${t.amount < 0 ? "debit" : "credit"}">${cents(t.amount)}</span>
      <span class="desc">${esc(t.raw_description.replace(/\n/g, " "))}</span>
      <span class="cat">${esc(t.budget_category ?? "—")}${t.class_source === "override" ? " ✱" : ""}</span>
      <button data-act="ovr" data-txn="${t.txn_id}" data-cat="${esc(t.budget_category ?? "")}">override</button>
      <button data-act="flag" data-txn="${t.txn_id}">flag</button>
    </div>`).join("");
  for (const b of $("ctx-list").querySelectorAll("button")) {
    if (b.dataset.act === "ovr")
      b.onclick = () => openPickerFor({type: "txn", txnId: b.dataset.txn},
        "Override this one transaction", b.dataset.cat || null);
    else
      b.onclick = async () => {
        if (await flagTxn(b.dataset.txn)) { b.textContent = "flagged ✓"; b.disabled = true; }
      };
  }
  $("ctx-list").querySelector(".focal")?.scrollIntoView({block: "center"});
}

/* ---- decisions ---- */
let decRules = [];
async function loadDecisions() {
  decRules = (await (await fetch("/api/rules")).json()).rules;
  renderDecisions();
}
function renderDecisions() {
  const f = $("dec-filter").value.toLowerCase();
  const shown = decRules.filter(r =>
    !f || r.pattern.toLowerCase().includes(f) || r.budget.toLowerCase().includes(f)).slice(0, 400);
  $("dec-list").innerHTML = shown.map(r => `
    <div class="row ${r.active ? "" : "inactive"}">
      <span class="cat">${r.source === "imported_legacy" ? "legacy" : r.source === "llm_approved" ? "llm✓" : "manual"}</span>
      <span class="desc">${r.match === "exact" ? "" : r.match + " "}${esc(r.pattern)}
        ${r.flag ? `<span class="why">⚑ ${esc(r.flag)}</span>` : ""}</span>
      <span class="cat"><b>${esc(r.budget)}</b></span>
      <span class="amt amount ${r.total < 0 ? "debit" : "credit"}">${cents(r.total)}</span>
      <span class="cat">${r.n} txns</span>
      <button data-id="${r.id}" data-act="recat" data-cat="${esc(r.budget)}">change</button>
      <button data-id="${r.id}" data-act="toggle">${r.active ? "disable" : "enable"}</button>
      <button data-id="${r.id}" data-act="flag">${r.flag ? "unflag" : "flag"}</button>
    </div>`).join("");
  for (const b of $("dec-list").querySelectorAll("button")) {
    if (b.dataset.act === "recat")
      b.onclick = () => openPickerFor({type: "rule", id: b.dataset.id},
        "Change this rule's category", b.dataset.cat);
    else if (b.dataset.act === "flag")
      b.onclick = async () => {
        const r = decRules.find(x => x.id === b.dataset.id);
        let note = "";
        if (!r.flag) {
          note = prompt("Follow-up note (optional):");
          if (note === null) return;
        }
        if (await post("/api/rules/update", {id: r.id, flag: r.flag ? "" : (note || "review")}))
          loadDecisions();
      };
    else
      b.onclick = async () => {
        const r = decRules.find(x => x.id === b.dataset.id);
        if (await post("/api/rules/update", {id: r.id, active: !r.active})) loadDecisions();
      };
  }
}

/* ---- charts ---- */
const VIZ = {
  slots: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7"],
  other: "#898781", unclass: "#b5b3ac",
  data: null, mode: "spend", fy: "all",
  colorMap: {}, topCats: {}, hidden: new Set(), inited: false,
};
const fmt$ = v => v >= 9.95e7 ? "$" + (v / 1e8).toFixed(1) + "M"
  : v >= 9.95e4 ? "$" + Math.round(v / 1e5) + "k" : "$" + (v / 100).toFixed(0);
const fyOfMonth = m => {
  const [y, mo] = m.split("-").map(Number);
  const s = mo >= 7 ? y : y - 1;
  return `${s}-${String(s + 1).slice(2)}`;
};

async function openCharts() {
  VIZ.data = (await (await fetch("/api/charts")).json());  // always fresh
  const fys = [...new Set(VIZ.data.rows.map(r => fyOfMonth(r.month)))].sort();
  $("viz-fy").innerHTML = `<option value="all">All time</option>`
    + fys.map(f => `<option value="${f}">FY ${f}</option>`).join("");
  if (![...$("viz-fy").options].some(o => o.value === VIZ.fy)) VIZ.fy = "all";
  $("viz-fy").value = VIZ.fy;
  for (const mode of ["spend", "income"]) {
    const tot = {};
    for (const r of VIZ.data.rows) tot[r.cat] = (tot[r.cat] ?? 0) + r[mode];
    const ranked = Object.entries(tot).filter(([c, v]) => v > 0 && c !== "(unclassified)")
      .sort((a, b) => b[1] - a[1]).map(([c]) => c);
    VIZ.topCats[mode] = ranked.slice(0, 7);
    VIZ.colorMap[mode] = new Map(ranked.slice(0, 7).map((c, i) => [c, VIZ.slots[i]]));
  }
  $("viz-fy").onchange = () => { VIZ.fy = $("viz-fy").value; renderViz(); };
  for (const b of $("viz-mode").querySelectorAll("button"))
    b.onclick = () => {
      VIZ.mode = b.dataset.m; VIZ.hidden = new Set(); VIZ.inited = false;
      for (const x of $("viz-mode").querySelectorAll("button"))
        x.classList.toggle("on", x === b);
      renderViz();
    };
  const exN = VIZ.data.excluded.length;
  const exSum = VIZ.data.excluded.reduce((a, t) => a + Math.abs(t.amount), 0);
  $("viz-note").textContent = exN
    ? `Excludes ${exN} txns ≥ $100k (${fmt$(exSum)} — press f to inspect) and transfers.`
    : "Transfers excluded.";
  renderViz();
  $("viz").showModal();
}

function vizColor(cat) {
  return cat === "(unclassified)" ? VIZ.unclass
    : VIZ.colorMap[VIZ.mode].get(cat) ?? VIZ.other;
}

function vizAgg() {
  const rows = VIZ.data.rows.filter(r => VIZ.fy === "all" || fyOfMonth(r.month) === VIZ.fy);
  const tot = {};
  for (const r of rows) tot[r.cat] = (tot[r.cat] ?? 0) + r[VIZ.mode];
  return Object.entries(tot).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
}

function renderViz() {
  const agg = vizAgg();
  const label = VIZ.mode === "spend" ? "Spending" : "Income";
  const period = VIZ.fy === "all" ? "all time" : "FY " + VIZ.fy;
  renderDonut(agg, label, period);
  renderVizBars(agg);
  renderTrend(label, period);
}

function arcPath(cx, cy, r0, r1, a0, a1) {
  a1 = Math.min(a1, a0 + Math.PI * 2 - 1e-4);
  const p = (r, a) => `${(cx + r * Math.sin(a)).toFixed(2)} ${(cy - r * Math.cos(a)).toFixed(2)}`;
  const big = a1 - a0 > Math.PI ? 1 : 0;
  return `M${p(r1, a0)} A${r1} ${r1} 0 ${big} 1 ${p(r1, a1)} `
    + `L${p(r0, a1)} A${r0} ${r0} 0 ${big} 0 ${p(r0, a0)} Z`;
}

function renderDonut(agg, label, period) {
  $("donut-title").textContent = `${label} · ${period}`;
  const total = agg.reduce((a, [, v]) => a + v, 0);
  if (!total) { $("donut").innerHTML = `<div class="viz-note">No ${label.toLowerCase()} in ${period}.</div>`; return; }
  const top = agg.filter(([c]) => VIZ.colorMap[VIZ.mode].has(c));
  const rest = total - top.reduce((a, [, v]) => a + v, 0);
  const slices = [...top.map(([c, v]) => [c, v, vizColor(c)])];
  if (rest > 0) slices.push(["Other", rest, VIZ.other]);
  let a = 0;
  const paths = slices.map(([c, v, col]) => {
    const a1 = a + (v / total) * Math.PI * 2;
    const d = arcPath(110, 110, 62, 100, a, a1);
    a = a1;
    return `<path d="${d}" fill="${col}" stroke="var(--surface-1)" stroke-width="2">
      <title>${esc(c)}: ${fmt$(v)} (${(100 * v / total).toFixed(0)}%)</title></path>`;
  }).join("");
  $("donut").innerHTML = `<svg viewBox="0 0 220 220" role="img" aria-label="${label} by category, ${period}">
    ${paths}
    <text x="110" y="105" text-anchor="middle" font-size="22" font-weight="600" fill="var(--text-primary)">${fmt$(total)}</text>
    <text x="110" y="124" text-anchor="middle" font-size="10" fill="var(--muted)">${label.toLowerCase()} · ${period}</text>
  </svg>`;
}

function renderVizBars(agg) {
  const total = agg.reduce((a, [, v]) => a + v, 0);
  const max = agg[0]?.[1] ?? 1;
  $("viz-bars").innerHTML = agg.map(([c, v]) => `
    <div class="bar-row">
      <span class="nm">${esc(c)}</span>
      <span class="track"><i style="width:${(100 * v / max).toFixed(1)}%;background:${vizColor(c)}"></i></span>
      <span class="val">${fmt$(v)} · ${(100 * v / total).toFixed(1)}%</span>
    </div>`).join("");
}

function trendSeries() {
  const rows = VIZ.data.rows.filter(r => VIZ.fy === "all" || fyOfMonth(r.month) === VIZ.fy);
  const months = [...new Set(rows.map(r => r.month))].sort();
  const cats = [...VIZ.topCats[VIZ.mode], "Other"];
  const series = new Map(cats.map(c => [c, new Array(months.length).fill(0)]));
  const mi = new Map(months.map((m, i) => [m, i]));
  for (const r of rows) {
    const key = VIZ.colorMap[VIZ.mode].has(r.cat) ? r.cat : "Other";
    series.get(key)[mi.get(r.month)] += r[VIZ.mode];
  }
  return {months, series};
}

function renderTrend(label, period) {
  $("trend-title").textContent = `${label} per month · ${period}`;
  const {months, series} = trendSeries();
  if (!VIZ.inited) {   // default: top 5 visible
    VIZ.hidden = new Set([...series.keys()].slice(5));
    VIZ.inited = true;
  }
  $("viz-chips").innerHTML = [...series.keys()].map(c => `
    <button class="chip ${VIZ.hidden.has(c) ? "off" : ""}" data-cat="${esc(c)}" aria-pressed="${!VIZ.hidden.has(c)}">
      <i style="background:${c === "Other" ? VIZ.other : vizColor(c)}"></i>${esc(c)}</button>`).join("");
  for (const b of $("viz-chips").querySelectorAll(".chip"))
    b.onclick = () => {
      VIZ.hidden.has(b.dataset.cat) ? VIZ.hidden.delete(b.dataset.cat) : VIZ.hidden.add(b.dataset.cat);
      renderTrend(label, period);
    };

  const vis = [...series.entries()].filter(([c]) => !VIZ.hidden.has(c));
  if (!months.length || !vis.length) { $("trend").innerHTML = `<div class="viz-note">Nothing to plot.</div>`; return; }
  const W = 760, H = 250, L = 52, R = 20, T = 12, B = 26;
  const pw = W - L - R, ph = H - T - B;
  const ymax = Math.max(...vis.flatMap(([, vals]) => vals), 1) * 1.08;
  const X = i => months.length === 1 ? L + pw / 2 : L + pw * i / (months.length - 1);
  const Y = v => T + ph - ph * v / ymax;
  const ticks = [0.25, 0.5, 0.75, 1].map(f => ymax * f);
  const step = Math.max(1, Math.ceil(months.length / 8));
  const xlabels = months.map((m, i) => i % step === 0
    ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="var(--muted)">${m}</text>` : "").join("");
  const grid = ticks.map(v => `
    <line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${fmt$(v)}</text>`).join("");
  const lines = vis.map(([c, vals]) => {
    const col = c === "Other" ? VIZ.other : vizColor(c);
    const d = vals.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  }).join("");
  const endLabels = vis.length <= 4 ? vis.map(([c, vals]) =>
    `<text x="${W - R - 2}" y="${(Y(vals[vals.length - 1]) - 5).toFixed(1)}" text-anchor="end"
       font-size="9" fill="var(--text-secondary)">${esc(c)}</text>`).join("") : "";
  $("trend").innerHTML = `<svg id="trend-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} per month">
    ${grid}
    <line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="var(--baseline)" stroke-width="1"/>
    ${xlabels}${lines}${endLabels}
    <g id="trend-hover" style="display:none">
      <line id="th-line" y1="${T}" y2="${T + ph}" stroke="var(--baseline)" stroke-width="1"/>
    </g>
    <rect id="trend-cap" x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/>
  </svg>`;

  const svg = $("trend-svg"), cap = $("trend-cap"), tip = $("viz-tip");
  cap.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const fx = (ev.clientX - box.left) / box.width * W;
    const i = Math.max(0, Math.min(months.length - 1,
      Math.round((fx - L) / (pw / Math.max(1, months.length - 1)))));
    $("th-line").setAttribute("x1", X(i)); $("th-line").setAttribute("x2", X(i));
    $("trend-hover").style.display = "";
    tip.style.display = "block";
    const host = tip.parentElement.getBoundingClientRect();
    const px = box.left - host.left + X(i) / W * box.width;
    tip.style.left = Math.min(px + 12, host.width - 190) + "px";
    tip.style.top = (box.top - host.top + 16) + "px";
    tip.innerHTML = `<b>${months[i]}</b>` + vis
      .map(([c, vals]) => [c, vals[i]]).sort((a, b) => b[1] - a[1])
      .map(([c, v]) => `<div class="tr"><span><i style="background:${c === "Other" ? VIZ.other : vizColor(c)};display:inline-block"></i> ${esc(c)}</span><span>${fmt$(v)}</span></div>`).join("");
  });
  cap.addEventListener("mouseleave", () => {
    $("trend-hover").style.display = "none"; tip.style.display = "none";
  });
}

/* ---- flags & unusual ---- */
async function flagTxn(txnId) {
  const note = prompt("Follow-up note (optional):") ?? null;
  if (note === null) return false;           // cancelled
  return !!(await post("/api/flag", {txn_id: txnId, note}));
}

async function loadUnusual() {
  const res = await (await fetch("/api/unusual")).json();
  $("followups-wrap").style.display =
    res.followups.length || res.rule_followups.length ? "" : "none";
  const ruleRows = res.rule_followups.map(r => `
    <div class="row">
      <span class="cat">rule</span>
      <span class="desc">${r.match === "exact" ? "" : r.match + " "}${esc(r.pattern)}
        <span class="why">⚑ ${esc(r.flag)}</span></span>
      <span class="cat"><b>${esc(r.budget)}</b></span>
      <button data-act="dec" data-pattern="${esc(r.pattern)}">decisions</button>
      <button data-act="unflag-rule" data-id="${r.id}">resolve</button>
    </div>`).join("");
  $("follow-list").innerHTML = ruleRows + res.followups.map(t => `
    <div class="row">
      <span class="date">${t.date}</span><span class="acct">${t.account_id}</span>
      <span class="amt amount ${t.amount < 0 ? "debit" : "credit"}">${cents(t.amount)}</span>
      <span class="desc">${esc(t.raw_description.replace(/\n/g, " "))}
        ${t.note ? `<span class="why">“${esc(t.note)}”</span>` : ""}</span>
      <span class="cat">${esc(t.budget_category ?? "—")}</span>
      <button data-act="ctx" data-date="${t.date}" data-txn="${t.txn_id}">context</button>
      <button data-act="resolve" data-txn="${t.txn_id}">resolve</button>
    </div>`).join("");
  $("unu-list").innerHTML = res.unusual.map(t => `
    <div class="row">
      <span class="date">${t.date}</span><span class="acct">${t.account_id}</span>
      <span class="amt amount ${t.amount < 0 ? "debit" : "credit"}">${cents(t.amount)}</span>
      <span class="desc">${esc(t.raw_description.replace(/\n/g, " "))}
        <span class="why">${t.reasons.map(esc).join(" · ")}</span></span>
      <span class="cat">${esc(t.budget_category ?? "—")}</span>
      <button data-act="ctx" data-date="${t.date}" data-txn="${t.txn_id}">context</button>
      <button data-act="flag" data-txn="${t.txn_id}">flag</button>
    </div>`).join("");
  for (const b of $("unu").querySelectorAll(".panel-list button")) {
    if (b.dataset.act === "ctx")
      b.onclick = () => { $("unu").close(); openContextAt(b.dataset.date, b.dataset.txn); };
    else if (b.dataset.act === "resolve")
      b.onclick = async () => { await post("/api/flag_resolve", {txn_id: b.dataset.txn}); loadUnusual(); };
    else if (b.dataset.act === "dec")
      b.onclick = () => {
        $("unu").close(); loadDecisions().then(() => {
          $("dec-filter").value = b.dataset.pattern; renderDecisions(); $("dec").showModal();
        });
      };
    else if (b.dataset.act === "unflag-rule")
      b.onclick = async () => {
        if (await post("/api/rules/update", {id: b.dataset.id, flag: ""})) loadUnusual();
      };
    else
      b.onclick = async () => { if (await flagTxn(b.dataset.txn)) loadUnusual(); };
  }
}

/* ---- keyboard ---- */
const KEYMAP = {a: "accept", e: "edit", s: "skip", t: "transfer", x: "oneoff",
                r: "rejectsug", u: "undoskip", c: "context", d: "decisions",
                f: "unusual", v: "charts"};
document.addEventListener("keydown", ev => {
  if (busy || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if ($("picker").open) {
    if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") return;
    const i = KEYS.indexOf(ev.key);
    if (i >= 0 && i < state.categories.length) {
      ev.preventDefault();
      pickCategory(state.categories[i]);
    }
    return;
  }
  if (document.querySelector("dialog[open]")) return;  // Esc closes natively
  if (ev.target.tagName === "INPUT") return;
  if (ev.key === "g") { fetchState(); return; }
  const act = KEYMAP[ev.key];
  if (act) { ev.preventDefault(); actions[act](); }
});
$("dec-filter").addEventListener("input", renderDecisions);
for (const b of document.querySelectorAll("footer button"))
  b.onclick = () => actions[b.dataset.act]();

fetchState();
</script>
