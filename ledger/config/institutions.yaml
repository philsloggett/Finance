# Accounts and per-institution CSV column mappings (spec 4.1).
# `owner` marks whose account it is (phil | elise | joint) — every transaction
# permanently carries its account_id, so per-person filtering is always possible.
accounts:
  savings:
    name: CommBank transaction account
    kind: transaction
    institution: legacy_sheet
    owner: phil
  credit:
    name: CommBank credit card
    kind: credit_card
    institution: legacy_sheet
    owner: phil
  netbank_saver:
    name: NetBank Saver
    kind: savings
    institution: commbank_csv
    owner: phil
  # Elise's accounts — uncomment and adjust when her first exports arrive.
  # Cross-owner transfers auto-null once both sides are imported (spec 6).
  # elise_spend:
  #   name: Elise transaction account
  #   kind: transaction
  #   institution: commbank_csv   # or add a new institution mapping for her bank
  #   owner: elise

institutions:
  # NetBank "CSV" export: no header row; Date, Amount (signed, debits
  # negative), Description, Balance. Columns are 0-based indexes.
  # VERIFY against the first real file before trusting an import.
  commbank_csv:
    header: false
    date_column: 0
    date_formats: ["%d/%m/%Y"]
    amount_column: 1
    description_column: 2
    balance_column: 3

  # Exports of the "Bank Statements Catchup" Google Sheet tabs.
  # Debit and Credit are separate positive columns; ValueChange is formula
  # junk and ignored. The Category column feeds legacy_labels on --legacy.
  legacy_sheet:
    date_column: Date
    date_formats: ["%Y-%m-%d %H:%M:%S", "%Y-%m-%d"]
    description_column: Text
    debit_column: Debit
    credit_column: Credit
    balance_column: null
    category_column: Category
